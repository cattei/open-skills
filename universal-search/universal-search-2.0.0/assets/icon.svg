<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">全网真相调查图标</title>
  <desc id="desc">深色方形背景上的青绿色放大镜，镜片内有三条信息文本线和一枚代表核验完成的勾选标记。</desc>
  <defs>
    <linearGradient id="bg" x1="110" y1="70" x2="900" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#081524"/>
      <stop offset="0.55" stop-color="#102C45"/>
      <stop offset="1" stop-color="#12415A"/>
    </linearGradient>
    <linearGradient id="ring" x1="250" y1="210" x2="760" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#78F4D9"/>
      <stop offset="0.52" stop-color="#48D9D1"/>
      <stop offset="1" stop-color="#28A9D0"/>
    </linearGradient>
    <linearGradient id="check" x1="340" y1="350" x2="560" y2="530" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C8FFF0"/>
    </linearGradient>
    <radialGradient id="lens" cx="0" cy="0" r="1" gradientTransform="translate(370 330) rotate(52) scale(390)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1B4860" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#0B2238" stop-opacity="0.94"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#020A12" flood-opacity="0.52"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="#06101C"/>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bg)"/>
  <rect x="38" y="38" width="948" height="948" rx="214" fill="none" stroke="#8AF7E2" stroke-opacity="0.13" stroke-width="4"/>
  <circle cx="284" cy="230" r="176" fill="#35C8C1" opacity="0.08" filter="url(#glow)"/>

  <g filter="url(#shadow)">
    <circle cx="440" cy="440" r="235" fill="url(#lens)"/>

    <path d="M320 350H535 M320 430H455 M320 510H500" fill="none" stroke="#83A9BC" stroke-opacity="0.64" stroke-width="30" stroke-linecap="round"/>

    <path d="M335 435L418 518L565 350" fill="none" stroke="#03121E" stroke-opacity="0.48" stroke-width="76" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 12)"/>
    <path d="M335 435L418 518L565 350" fill="none" stroke="url(#check)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M610 610L785 785" fill="none" stroke="#041421" stroke-opacity="0.68" stroke-width="116" stroke-linecap="round"/>
    <path d="M610 610L785 785" fill="none" stroke="url(#ring)" stroke-width="78" stroke-linecap="round"/>
    <path d="M644 644L756 756" fill="none" stroke="#B4FFED" stroke-opacity="0.24" stroke-width="18" stroke-linecap="round"/>

    <circle cx="440" cy="440" r="235" fill="none" stroke="#041421" stroke-opacity="0.55" stroke-width="76"/>
    <circle cx="440" cy="440" r="235" fill="none" stroke="url(#ring)" stroke-width="56"/>
    <path d="M280 292A235 235 0 0 1 515 220" fill="none" stroke="#D2FFF3" stroke-opacity="0.38" stroke-width="14" stroke-linecap="round"/>
  </g>

  <circle cx="759" cy="278" r="22" fill="#FFC766"/>
  <circle cx="759" cy="278" r="38" fill="none" stroke="#FFC766" stroke-opacity="0.22" stroke-width="8"/>
</svg>
